<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="English Hub — a personal Grade 8 English learning journal.">
  <title>English Hub — Teen Journal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="design-system.css">
</head>
<body>
  <button class="menu-button" id="menuButton" aria-label="Open navigation" aria-expanded="false">☰</button>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="paperclip" aria-hidden="true"></div>
      <div class="brand"><span>English</span><strong>Hub</strong><small>Teen Journal · Grade 8</small></div>
      <nav class="journal-tabs" aria-label="Main navigation">
        <button class="nav-tab active" data-page="dashboard">Dashboard</button>
        <button class="nav-tab" data-page="module">Current Module</button>
        <button class="nav-tab" data-page="lesson" data-lesson="1">Lesson Practice</button>
        <button class="nav-tab" data-page="grammar">Grammar Lab</button>
        <button class="nav-tab" data-page="vocabulary">Vocabulary</button>
        <button class="nav-tab" data-page="mistakes">My Mistakes</button>
        <button class="nav-tab" data-page="progress">Progress</button>
      </nav>
      <blockquote class="side-note"><b>THIS WEEK</b><br><small>Read for meaning first. Use the lesson tabs to return to unfinished work.</small></blockquote>
      <button class="text-button" id="resetButton">Reset progress</button>
    </aside>
    <main class="main-content" id="app" tabindex="-1"></main>
    <div class="margin-doodles" aria-hidden="true"><span>✦</span><span>♡</span><span>~</span></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>window.addEventListener("error",function(e){var root=document.getElementById("app");if(root&&!root.innerHTML){root.innerHTML="<div class='card'><h2>The journal could not start.</h2><p>"+e.message+" (line "+e.lineno+")</p></div>";}});</script>
  <script src="lesson3.js"></script>
  <script src="lesson4.js"></script>
  <script src="lesson5.js"></script>
  <script src="lesson1reading.js"></script>
  <script src="app.js"></script>
</body>
</html>
